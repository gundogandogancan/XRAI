# XRAI native iOS app — generated into XRAI.xcodeproj with `xcodegen generate` (P03-00).
# The app links ONLY production products of XRAICore. XRAIVaultTesting is linked by the hosted
# test bundle alone (enforced by CompositionBoundaryTests.manifestRule).
name: XRAI
options:
  bundleIdPrefix: com.xrai
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "26.0"

packages:
  XRAICore:
    path: Packages/XRAICore

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: 47XQMQZLF6
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_TESTABILITY: YES
    ONLY_ACTIVE_ARCH: YES
    ARCHS: $(ARCHS_STANDARD)
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64

targets:
  XRAI:
    type: application
    platform: iOS
    sources:
      - path: App/XRAI
    dependencies:
      - package: XRAICore
        product: XRAIIdentityTime
      - package: XRAICore
        product: XRAINumerology
      - package: XRAICore
        product: XRAIVaultContracts
      - package: XRAICore
        product: XRAIVaultCryptoKit
      - package: XRAICore
        product: XRAIVaultKeychain
    entitlements:
      path: App/XRAI/XRAI.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.xrai.app
    info:
      path: App/XRAI/Info.plist
      properties:
        CFBundleDisplayName: XRAI
        CFBundleName: XRAI
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: "© 2026 Dogancan Gundogan"
    settings:
      base:
        PRODUCT_NAME: XRAI
        PRODUCT_BUNDLE_IDENTIFIER: com.xrai.app
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES

  XRAIHostedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/XRAIHostedTests
      - path: Packages/XRAICore/Tests/XRAIVaultKeychainTests
    dependencies:
      - target: XRAI
      - package: XRAICore
        product: XRAIVaultContracts
      - package: XRAICore
        product: XRAIVaultCryptoKit
      - package: XRAICore
        product: XRAIVaultKeychain
      - package: XRAICore
        product: XRAIVaultTesting
    settings:
      base:
        PRODUCT_NAME: XRAIHostedTests
        PRODUCT_BUNDLE_IDENTIFIER: com.xrai.app.hostedtests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/XRAI.app/XRAI
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  XRAI:
    build:
      targets:
        XRAI: all
        XRAIHostedTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - XRAIHostedTests
