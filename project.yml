# XRAI native iOS app — generated into XRAI.xcodeproj with `xcodegen generate` (P03-00, fixed P03-00F).
# The app links ONLY production products of XRAICore. XRAIVaultTesting is linked by the hosted
# test bundle alone (enforced by CompositionBoundaryTests.manifestRule).
#
# NOTE (P03-00F): the installed xcodegen cannot load its platform/config setting presets
# ("No iOS settings found"), so every default Xcode would normally provide is written here
# explicitly — in particular LD_RUNPATH_SEARCH_PATHS, without which the embedded package
# frameworks are not found by dyld on a real device.
name: XRAI
options:
  bundleIdPrefix: com.xrai
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "26.0"
  developmentLanguage: tr

packages:
  XRAICore:
    path: Packages/XRAICore

settings:
  base:
    SDKROOT: iphoneos
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: 47XQMQZLF6
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
    ONLY_ACTIVE_ARCH: YES
    ARCHS: $(ARCHS_STANDARD)
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_OBJC_ARC: YES
    COPY_PHASE_STRIP: NO
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: -Onone
      GCC_OPTIMIZATION_LEVEL: 0
      GCC_PREPROCESSOR_DEFINITIONS: DEBUG=1 $(inherited)
      ENABLE_TESTABILITY: YES
      DEBUG_INFORMATION_FORMAT: dwarf
      MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
    Release:
      SWIFT_OPTIMIZATION_LEVEL: -O
      SWIFT_COMPILATION_MODE: wholemodule
      GCC_OPTIMIZATION_LEVEL: s
      ENABLE_TESTABILITY: NO
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      ENABLE_NS_ASSERTIONS: NO
      VALIDATE_PRODUCT: YES

targets:
  XRAI:
    type: application
    platform: iOS
    sources:
      - path: App/XRAI
    dependencies:
      - package: XRAICore
        product: XRAIIdentityTime
      - package: XRAICore
        product: XRAINumerology
      - package: XRAICore
        product: XRAIVaultContracts
      - package: XRAICore
        product: XRAIVaultCryptoKit
      - package: XRAICore
        product: XRAIVaultKeychain
    entitlements:
      path: App/XRAI/XRAI.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.xrai.app
    info:
      path: App/XRAI/Info.plist
      properties:
        CFBundleDisplayName: XRAI
        CFBundleName: XRAI
        UILaunchScreen:
          UIImageName: LaunchLogo
          UIColorName: LaunchBackground
          UIImageRespectsSafeAreaInsets: true
        CFBundleDevelopmentRegion: tr
        CFBundleLocalizations: [tr, en]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: "© 2026 Dogancan Gundogan"
    settings:
      base:
        PRODUCT_NAME: XRAI
        PRODUCT_BUNDLE_IDENTIFIER: com.xrai.app
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # dyld must find the embedded package frameworks inside XRAI.app/Frameworks on a real device.
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"

  XRAIHostedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/XRAIHostedTests
      - path: Packages/XRAICore/Tests/XRAIVaultKeychainTests
      # P03-04: the store suite runs inside the signed app on Simulator and device (temp dir in the app container).
      - path: Packages/XRAICore/Tests/XRAIVaultStoreTests
    dependencies:
      - target: XRAI
      - package: XRAICore
        product: XRAIVaultContracts
      - package: XRAICore
        product: XRAIVaultCryptoKit
      - package: XRAICore
        product: XRAIVaultKeychain
      - package: XRAICore
        product: XRAIVaultStore
      - package: XRAICore
        product: XRAIVaultTesting
    settings:
      base:
        PRODUCT_NAME: XRAIHostedTests
        PRODUCT_BUNDLE_IDENTIFIER: com.xrai.app.hostedtests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/XRAI.app/XRAI
        BUNDLE_LOADER: $(TEST_HOST)
        # Resolve the HOST app's copy of each package framework first (one copy loaded), then the bundle's own.
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
          - "@loader_path/Frameworks"

  XRAIUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: App/XRAIUITests
    dependencies:
      - target: XRAI
    settings:
      base:
        PRODUCT_NAME: XRAIUITests
        PRODUCT_BUNDLE_IDENTIFIER: com.xrai.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: XRAI
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
          - "@loader_path/Frameworks"

schemes:
  XRAI:
    build:
      targets:
        XRAI: all
        XRAIHostedTests: [test]
        XRAIUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - XRAIHostedTests
        - XRAIUITests
